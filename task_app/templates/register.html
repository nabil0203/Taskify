{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
    Sign Up Form
{% endblock %}

{% block content %}
<h2 class="mb-4">Sign Up</h2>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <br>
    <button type="submit" class="btn btn-success">Sign Up</button>
</form>
{% endblock %}
