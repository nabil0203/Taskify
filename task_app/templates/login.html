{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}
Login - Taskify
{% endblock %}


{% block content %}
<div class="container d-flex justify-content-center align-items-center" style="min-height: 85vh;">

    <div class="col-sm-10 col-md-8 col-lg-5">

        <div class="card shadow-lg rounded-5 border-0">
            <div class="card-body p-5">

                <h2 class="text-center mb-5 fw-bolder" style="color: var(--bs-primary);">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Welcome Back
                </h2>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}

                    <button type="submit" class="btn w-100 btn-lg mt-4 text-white fw-bold"
                        style="background-color: var(--bs-primary); border-color: var(--bs-primary);">
                        Login
                    </button>
                </form>

                <div class="text-center mt-4 border-top pt-3">
                    <!-- <p class="small text-muted mb-2">
                        <a href="{% url 'pass_change' %}" class="text-decoration-none small text-secondary">
                            Forgot Password?
                        </a>
                    </p> -->
                    <p class="small mb-0">
                        Don’t have an account?
                        <a href="{% url 'register' %}" class="text-decoration-none fw-semibold"
                            style="color: var(--bs-secondary);">Register here</a>
                    </p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
